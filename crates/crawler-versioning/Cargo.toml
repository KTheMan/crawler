[package]
name = "crawler-versioning"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crawler-document = { path = "../crawler-document" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
crawler-history = { path = "../crawler-history" }
