[package]
name = "crawler-feature-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crawler-render-packet = { path = "../crawler-render-packet" }
monstertruck-meshing = { workspace = true }
monstertruck-modeling = { workspace = true, features = ["fillet"] }
monstertruck-solid = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
