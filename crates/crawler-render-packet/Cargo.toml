[package]
name = "crawler-render-packet"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monstertruck-meshing = { path = "../../vendor/monstertruck/monstertruck-meshing" }
monstertruck-modeling = { path = "../../vendor/monstertruck/monstertruck-modeling" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
