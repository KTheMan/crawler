[workspace]
members = [
    "contracts/kernel-baseline",
    "crates/crawler-alpha-reference",
    "crates/crawler-document",
    "crates/crawler-feature-graph",
    "crates/crawler-feature-kernel",
    "crates/crawler-history",
    "crates/crawler-interchange",
    "crates/crawler-kernel-worker",
    "crates/crawler-operation-schema",
    "crates/crawler-package",
    "crates/crawler-part-engine",
    "crates/crawler-part-runtime",
    "crates/crawler-parameters",
    "crates/crawler-quantity",
    "crates/crawler-reference-fixtures",
    "crates/crawler-render-packet",
    "crates/crawler-sketch",
    "crates/crawler-storage",
    "crates/crawler-topology-repair",
    "crates/crawler-versioning",
]
resolver = "2"

[workspace.dependencies]
monstertruck-gpu = "=0.4.0"
monstertruck-mesh = "=0.4.0"
monstertruck-meshing = "=0.4.0"
monstertruck-modeling = "=0.4.0"
monstertruck-render = "=0.4.0"
monstertruck-solid = "=0.4.0"
monstertruck-step = "=0.4.0"
monstertruck-topology = "=0.4.0"
monstertruck-wasm = "=0.4.0"
