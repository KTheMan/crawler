name: Deploy alpha to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-alpha
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    steps:
      - name: Check out alpha
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install browser application dependencies
        run: pnpm --dir web/crawler-app install --frozen-lockfile

      - name: Run browser application unit tests
        run: pnpm --dir web/crawler-app test:unit

      - name: Build GitHub Pages application
        run: pnpm --dir web/crawler-app build:pages

      - name: Install Chrome for the deployed-path smoke test
        run: pnpm --dir web/crawler-app exec playwright install --with-deps chrome

      - name: Smoke-test the GitHub Pages base path
        run: pnpm --dir web/crawler-app test:pages

      - name: Disable Jekyll processing
        run: touch web/crawler-app/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/crawler-app/dist

  deploy:
    if: github.ref == 'refs/heads/alpha'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
